
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Study Planner</h1>
        <p>Plan your studies, manage your tasks, and achieve your goals!</p>
    </header>

    <!-- Dashboard -->
    <section id="dashboard">
        <h2>My Dashboard</h2>

        <div class="dashboard-cards">
            <div class="dashboard-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Pending Tasks</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Completed Tasks</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Total Study Time</h3>
                <p id="totalStudyTime">0 minutes</p>
            </div>
        </div>
    </section>

    <hr>

    <!-- Add Study Task -->
    <section>
        <h2>Add a Study Task</h2>

        <form id="taskForm">
            <label for="task">Task Name:</label>
            <input
                type="text"
                id="task"
                placeholder="Enter your study task"
                required
            >

            <label for="subject">Subject:</label>
            <input
                type="text"
                id="subject"
                placeholder="Enter subject"
                required
            >

            <label for="deadline">Deadline:</label>
            <input type="date" id="deadline" required>

            <button type="submit">Add Task</button>
        </form>
    </section>

    <!-- Display Study Tasks -->
    <section>
        <h2>My Study Tasks</h2>
        <ul id="taskList"></ul>
    </section>

    <hr>

    <!-- Record Study Session -->
    <section>
        <h2>Record a Study Session</h2>

        <form id="sessionForm">
            <label for="sessionSubject">Subject:</label>
            <input
                type="text"
                id="sessionSubject"
                placeholder="Enter subject studied"
                required
            >

            <label for="studyDate">Study Date:</label>
            <input type="date" id="studyDate" required>

            <label for="duration">Duration (minutes):</label>
            <input
                type="number"
                id="duration"
                min="1"
                step="1"
                placeholder="e.g. 60"
                required
            >

            <label for="notes">Notes (optional):</label>
            <textarea
                id="notes"
                placeholder="What did you study?"
            ></textarea>

            <button type="submit">Save Study Session</button>
        </form>
    </section>

    <!-- Display Study Sessions -->
    <section>
        <h2>My Study Sessions</h2>
        <ul id="sessionList"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
